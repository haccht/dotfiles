# ---------------------------------------------------------------------------
# General Options
# ---------------------------------------------------------------------------
set-option -g prefix C-q
unbind C-b

set-option -sg escape-time 10
set-option -g focus-events on
set-option -g bell-action none
set-option -g history-limit 100000
set-option -g default-terminal "tmux-256color"
set-option -as terminal-overrides ",*256col*:RGB,xterm-*:RGB"
set-option -g allow-rename off
set-option -g set-titles on
set-option -g set-titles-string "#T #{session_alerts}"
set-option -g renumber-windows on
set-option -g visual-activity on
set-option -g set-clipboard on
set-option -g mouse off

set-window-option -g mode-keys vi
set-window-option -g automatic-rename off
set-window-option -g monitor-activity on

# ---------------------------------------------------------------------------
# Key Bindings
# ---------------------------------------------------------------------------
bind q send-prefix
bind i display-panes
bind n new-window -c "#{pane_current_path}"
bind b break-pane
bind x kill-pane
bind X kill-window
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"
bind \; command-prompt
bind s choose-window "join-pane -h -t '%%'"
bind S choose-window "join-pane -t '%%'"
bind c setw synchronize-panes off \; display "synchronize off!"
bind C setw synchronize-panes on  \; display "synchronize on!"
bind m set-option -g mouse \; display "mouse: #{?mouse,on,off}"
bind C-q last-window
bind C-p if-shell -F '#{==:#{session_name},popup}' \
  'detach-client' \
  'popup -xC -yC -w80% -h80% -E -d "#{pane_current_path}" "tmux attach -c \"#{pane_current_path}\" -t popup || tmux new -s popup"'

# Copy mode (vi)
unbind ]
bind -T copy-mode-vi Enter send -X cancel
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi V     send -X select-line
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-selection
bind p paste-buffer \; delete-buffer

# Pane navigation & splitting
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind - split-window -v -c "#{pane_current_path}" \; select-layout -E
bind | split-window -h -c "#{pane_current_path}" \; select-layout -E
set-hook -g pane-exited 'select-layout -E'

# Pane resizing
bind -r H resize-pane -L
bind -r L resize-pane -R
bind -r J resize-pane -D
bind -r K resize-pane -U

# ---------------------------------------------------------------------------
# Status Line & Appearance
# ---------------------------------------------------------------------------
set -g status on
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 100
set -g status-style bg="#202020",fg="#505050"
set -g status-left-style none
set -g status-right-style none

set -g message-style bg="#303030",fg="#b0b0b0"
set -g message-command-style bg="#303030",fg="#b0b0b0"
set -g pane-border-style fg="#404040"
set -g pane-active-border-style fg="#ff3030"

set-window-option -g window-status-separator ""
set-window-option -g window-status-style bg="#202020",fg="#505050",none
set-window-option -g window-status-activity-style bg="#202020",fg="#505050",none

set -g status-left "#[fg=#505050,bg=#202020] #S: "
set -g status-right "#[fg=#505050,bg=#202020] %Y/%m/%d - %H:%M | #{USER}@#h"
set-window-option -g window-status-format "#[fg=#505050,bg=#202020] #I | #W "
set-window-option -g window-status-current-format "#[fg=#b0b0b0,bg=#303030] #I | #W "
